<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="340" viewBox="0 0 1200 340">
  <style>
    .sans { font-family: 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif; }
    .mono { font-family: 'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace; }
    .in { animation: rise .9s cubic-bezier(.2,.7,.2,1) backwards; }
    .d1 { animation-delay: .1s; } .d2 { animation-delay: .35s; }
    .d3 { animation-delay: .6s; } .d4 { animation-delay: .85s; }
    .bar { transform-box: fill-box; transform-origin: left;
           animation: grow .8s .5s cubic-bezier(.2,.7,.2,1) backwards; }
    .node { animation: pulse 3.2s ease-in-out infinite; }
    .n2 { animation-delay: .8s; } .n3 { animation-delay: 1.6s; } .n4 { animation-delay: 2.4s; }
    .caret { animation: blink 1.1s steps(1) infinite; }
    @keyframes rise { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: none; } }
    @keyframes grow { from { transform: scaleX(0); } to { transform: scaleX(1); } }
    @keyframes pulse { 0%, 100% { stroke-opacity: .55; } 50% { stroke-opacity: 1; } }
    @keyframes blink { 50% { opacity: 0; } }
    @media (prefers-reduced-motion: reduce) {
      .in, .bar, .node, .caret { animation: none; }
    }
  </style>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#070d1a"/>
      <stop offset="1" stop-color="#0c2238"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.8" cy="0.45" r="0.5">
      <stop offset="0" stop-color="#22d3ee" stop-opacity="0.16"/>
      <stop offset="1" stop-color="#22d3ee" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#94a3b8" stroke-opacity="0.06"/>
    </pattern>
    <filter id="soft" x="-2" y="-2" width="5" height="5">
      <feGaussianBlur stdDeviation="2.5"/>
    </filter>
    <clipPath id="card"><rect width="1200" height="340" rx="16"/></clipPath>

    <path id="e1" d="M820 100L930 150"/>
    <path id="e2" d="M930 150L1060 90"/>
    <path id="e3" d="M1060 90L1130 180"/>
    <path id="e4" d="M1130 180L1010 245"/>
    <path id="e5" d="M1010 245L930 150"/>
    <path id="e6" d="M760 210L870 255L1010 245"/>
    <path id="e7" d="M870 255L930 150"/>
    <path id="e8" d="M760 210L820 100"/>
  </defs>

  <g clip-path="url(#card)">
    <rect width="1200" height="340" fill="url(#bg)"/>
    <rect width="1200" height="340" fill="url(#grid)"/>
    <rect width="1200" height="340" fill="url(#glow)"/>

    <!-- links -->
    <g stroke="#22d3ee" stroke-opacity="0.3" stroke-width="1.2" fill="none">
      <use href="#e1"/><use href="#e2"/><use href="#e3"/><use href="#e4"/>
      <use href="#e5"/><use href="#e6"/><use href="#e7"/><use href="#e8"/>
      <path d="M1060 90L1010 245M1060 90L1150 45M1130 180L1185 275"/>
    </g>
    <g stroke="#22d3ee" stroke-opacity="0.16" stroke-dasharray="3 5" fill="none">
      <path d="M760 210L690 130M820 100L760 30M1010 245L1070 320"/>
    </g>

    <!-- packets travelling across the network -->
    <g fill="#67e8f9">
      <circle r="3"><animateMotion dur="2.6s" repeatCount="indefinite"><mpath href="#e1"/></animateMotion></circle>
      <circle r="3"><animateMotion dur="2.6s" begin="1.3s" repeatCount="indefinite"><mpath href="#e2"/></animateMotion></circle>
      <circle r="3"><animateMotion dur="3s" begin=".6s" repeatCount="indefinite"><mpath href="#e3"/></animateMotion></circle>
      <circle r="3"><animateMotion dur="3s" begin="2s" repeatCount="indefinite"><mpath href="#e4"/></animateMotion></circle>
      <circle r="3"><animateMotion dur="2.4s" begin="1s" repeatCount="indefinite"><mpath href="#e5"/></animateMotion></circle>
      <circle r="3"><animateMotion dur="4s" begin=".2s" repeatCount="indefinite"><mpath href="#e6"/></animateMotion></circle>
      <circle r="3"><animateMotion dur="2.2s" begin="1.7s" repeatCount="indefinite"><mpath href="#e7"/></animateMotion></circle>
      <circle r="3"><animateMotion dur="2.8s" begin=".9s" repeatCount="indefinite"><mpath href="#e8"/></animateMotion></circle>
    </g>

    <!-- nodes -->
    <g fill="#0b1626" stroke="#22d3ee" stroke-width="1.5">
      <circle class="node" cx="820" cy="100" r="6"/>
      <circle class="node n2" cx="1060" cy="90" r="6"/>
      <circle class="node n3" cx="1130" cy="180" r="6"/>
      <circle class="node n4" cx="870" cy="255" r="6"/>
      <circle class="node n2" cx="760" cy="210" r="5"/>
      <circle class="node n3" cx="1010" cy="245" r="6"/>
      <circle class="node n4" cx="1150" cy="45" r="4"/>
      <circle class="node" cx="1185" cy="275" r="4"/>
    </g>
    <g fill="#22d3ee" fill-opacity="0.4">
      <circle cx="690" cy="130" r="3"/><circle cx="760" cy="30" r="3"/><circle cx="1070" cy="320" r="3"/>
    </g>

    <!-- secured core node -->
    <circle cx="930" cy="150" r="18" fill="none" stroke="#22d3ee">
      <animate attributeName="r" values="18;46" dur="2.8s" repeatCount="indefinite"/>
      <animate attributeName="stroke-opacity" values=".6;0" dur="2.8s" repeatCount="indefinite"/>
    </circle>
    <circle cx="930" cy="150" r="24" fill="#22d3ee" fill-opacity="0.35" filter="url(#soft)"/>
    <circle cx="930" cy="150" r="17" fill="#0b1626" stroke="#22d3ee" stroke-width="2"/>
    <g fill="none" stroke="#22d3ee" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
      <path d="M925.5 149v-3.5a4.5 4.5 0 0 1 9 0V149"/>
      <rect x="922.5" y="149" width="15" height="10" rx="2"/>
    </g>

    <!-- text -->
    <text class="mono in d1" x="72" y="98" fill="#22d3ee" font-size="15" letter-spacing="3">COMPUTER NETWORKS · CYBERSECURITY</text>
    <text class="sans in d2" x="70" y="168" fill="#f1f5f9" font-size="62" font-weight="700" letter-spacing="-1">Mohammad Malkawi</text>
    <rect class="bar" x="72" y="194" width="56" height="3" rx="1.5" fill="#22d3ee"/>
    <text class="sans in d3" x="72" y="238" fill="#a5b4c8" font-size="21">Network security · Infrastructure · Robotics &amp; AI</text>
    <g class="in d4">
      <text class="mono" x="72" y="280" fill="#64748b" font-size="15">$ securing the systems we connect<tspan class="caret" fill="#22d3ee">_</tspan></text>
    </g>
  </g>
</svg>
