<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Link preview</title>
    <link rel="stylesheet" href="../node_modules/@fontsource-variable/bricolage-grotesque/index.css" />
    <link rel="stylesheet" href="../node_modules/@fontsource-variable/figtree/index.css" />
    <link rel="stylesheet" href="../node_modules/@fontsource-variable/jetbrains-mono/index.css" />
    <style>
      html, body { margin: 0; }
      body {
        width: 1200px; height: 630px; overflow: hidden; position: relative;
        background-color: #f5f5f1;
        background-image: linear-gradient(rgba(22,22,26,.05) 1px, transparent 1px), linear-gradient(90deg, rgba(22,22,26,.05) 1px, transparent 1px);
        background-size: 44px 44px;
        font-family: "Figtree Variable", sans-serif; color: #16161a;
      }
      .copy { position: absolute; left: 72px; top: 92px; width: 560px; }
      .mark { display: grid; grid-template-columns: 22px 22px; grid-template-rows: 22px 22px; gap: 6px; }
      .mark i { border-radius: 6px; background: #f2a516; }
      .mark i:last-child { grid-column: 2; grid-row: 2; background: #16161a; }
      h1 { margin: 34px 0 0; font-family: "Bricolage Grotesque Variable", sans-serif; font-size: 72px; line-height: 1; font-weight: 800; letter-spacing: -0.04em; }
      .role { margin-top: 18px; font-size: 30px; font-weight: 600; color: #3d3d44; }
      .hl { background: linear-gradient(transparent 68%, rgba(242,165,22,.5) 68%); }
      .tags { margin-top: 34px; display: flex; gap: 12px; flex-wrap: wrap; }
      .tags span { padding: 8px 16px; border-radius: 999px; border: 2px solid #16161a; background: #fff; font-family: "JetBrains Mono Variable", monospace; font-size: 18px; box-shadow: 3px 3px 0 #16161a; }
      .frame { position: absolute; right: 64px; top: 70px; width: 470px; height: 440px; border: 2.5px solid #16161a; border-radius: 26px; box-shadow: 9px 9px 0 #16161a; overflow: hidden; transform: rotate(2deg); background: #fff; }
      .frame img { width: 100%; height: 100%; object-fit: cover; }
      .stat { position: absolute; right: 360px; bottom: 58px; padding: 16px 22px; border: 2.5px solid #16161a; border-radius: 18px; background: #f2a516; box-shadow: 6px 6px 0 #16161a; transform: rotate(-3deg); }
      .stat b { display: block; font-family: "Bricolage Grotesque Variable", sans-serif; font-size: 44px; line-height: 1; letter-spacing: -0.04em; }
      .stat span { font-size: 17px; font-weight: 700; }
      .url { position: absolute; left: 72px; bottom: 56px; font-family: "JetBrains Mono Variable", monospace; font-size: 20px; color: #676770; }
    </style>
  </head>
  <body>
    <div class="copy">
      <div class="mark"><i></i><i></i></div>
      <h1>Mohammad H. Malkawi</h1>
      <p class="role">Networks &amp; security student building <span class="hl">smarter infrastructure</span></p>
      <div class="tags"><span>SALKA</span><span>C-Layer</span><span>IEEE Jadara</span></div>
    </div>
    <div class="frame"><img src="../public/img/salka-light.webp" alt="" /></div>
    <div class="stat"><b>15%</b><span>less waiting in simulation</span></div>
    <p class="url">malkawi06.github.io/malkawi06</p>
  </body>
</html>
